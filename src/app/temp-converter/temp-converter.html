<table>
  <tr>
    <td>
      <label for="input1">Input 1:</label>
    </td>
    <td>
      <input name="input1" id="input1" #v1>
    </td>
  </tr>
  <tr>
    <td>
      <label for="input2">Input 2:</label>
    </td>
    <td>
      <input name="input2" id="input2" #v2>
    </td>
  </tr>
  <tr>
    <td colspan="2">
      <button (click)="multiply(v1.value, v2.value)">*</button>
      <button (click)="divide(v1.value, v2.value)">/</button>
      <button (click)="add(v1.value, v2.value)">+</button>
      <button (click)="subtract(v1.value, v2.value)">-</button>
    </td>
  </tr>
</table>
<h2>Résultat : {{ result }}</h2>
