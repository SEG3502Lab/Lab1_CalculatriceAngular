<table>
  <tr>
    <td>
      <label for="input1">Input 1:</label>
    </td>
    <td>
      <input name="input1" id="input1" value="{{celsiusValue | number: '1.0-2'}}" #celsius>
    </td>
  </tr>
  <tr>
    <td>
      <label for="input2">Input 2:</label>
    </td>
    <td>
      <input name="input2" id="input2" value="{{fahrenheitValue | number: '1.0-2'}}" #fahrenheit>
    </td>
  </tr>
  <tr>
    <td>
      <button (click)="convertCelsius(celsius.value)">*</button>
    </td>
    <td>
      <button (click)="convertFahrenheit(fahrenheit.value)">/</button>
    </td>
    <td>
      <button (click)="convertCelsius(celsius.value)">+</button>
    </td>
    <td>
      <button (click)="convertFahrenheit(fahrenheit.value)">-</button>
    </td>
  </tr>
</table>
